<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>The Canvas — Coming Soon</title>
  
  <meta name="description" content="The Canvas — Something extraordinary is in the making.">
  <meta name="theme-color" content="#070a13">
  
  <link rel="icon" type="image/png" href="public/brand/the-canvas-logo.png">
  <link rel="apple-touch-icon" href="public/brand/the-canvas-logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "American Typewriter";
      src: url("public/fonts/American-Typewriter-Regular.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070a13;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, #1cb0f6 0%, rgba(20, 51, 99, 0) 70%);
      filter: blur(120px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 85%);
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 520px;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 32px;
      animation: float 6s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: #1cb0f6;
      filter: blur(30px);
      opacity: 0.3;
      z-index: -1;
    }

    .logo-img {
      width: clamp(140px, 30vw, 220px);
      height: clamp(140px, 30vw, 220px);
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 40px rgba(28, 176, 246, 0.35);
      display: block;
      user-select: none;
    }

    .brand-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #a9bde6;
      margin-bottom: 12px;
    }

    .coming-soon-heading {
      font-size: clamp(2.5rem, 7vw, 4.2rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .font-typewriter {
      font-family: "American Typewriter", Georgia, serif;
      color: #1cb0f6;
      text-shadow: 0 0 25px rgba(28, 176, 246, 0.5);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="ambient-glow"></div>
  <div class="ambient-grid"></div>

  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="public/brand/the-canvas-logo.png" alt="The Canvas Logo" class="logo-img">
    </div>

    <div class="brand-title">The Canvas</div>
    <h1 class="coming-soon-heading">
      Coming Soon
    </h1>
    <p class="subtitle">Something extraordinary is in the making.</p>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
