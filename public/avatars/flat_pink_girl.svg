<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#db2777"/>

  <!-- Headband of Headphones -->
  <path d="M120 250 C120 120, 392 120, 392 250" stroke="#f1f5f9" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M140 220 C140 145, 372 145, 372 220" stroke="#06b6d4" stroke-width="8" fill="none"/>

  <!-- Hair Back -->
  <circle cx="256" cy="270" r="140" fill="#18181b"/>

  <!-- Neck & Collar -->
  <rect x="226" y="380" width="60" height="70" fill="#fbcfe8"/>
  <path d="M170 430 Q256 460 342 430 L350 512 L162 512 Z" fill="#facc15"/>

  <!-- Face -->
  <ellipse cx="256" cy="285" rx="100" ry="110" fill="#fed7aa"/>

  <!-- Hair Bangs -->
  <path d="M156 240 Q256 180 356 240 Q356 190 320 180 Q256 160 190 180 Z" fill="#18181b"/>
  <path d="M156 240 Q170 310 160 340 Q150 280 156 240 Z" fill="#18181b"/>
  <path d="M356 240 Q342 310 352 340 Q362 280 356 240 Z" fill="#18181b"/>

  <!-- Glasses -->
  <circle cx="215" cy="280" r="34" fill="none" stroke="#be185d" stroke-width="8"/>
  <circle cx="297" cy="280" r="34" fill="none" stroke="#be185d" stroke-width="8"/>
  <line x1="249" y1="280" x2="263" y2="280" stroke="#be185d" stroke-width="8"/>

  <!-- Eyes -->
  <circle cx="215" cy="280" r="12" fill="#0f172a"/>
  <circle cx="297" cy="280" r="12" fill="#0f172a"/>
  <circle cx="211" cy="276" r="4" fill="#ffffff"/>
  <circle cx="293" cy="276" r="4" fill="#ffffff"/>

  <!-- Cute Blush -->
  <ellipse cx="185" cy="315" rx="16" ry="10" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="327" cy="315" rx="16" ry="10" fill="#f43f5e" opacity="0.4"/>

  <!-- Cheerful Smile -->
  <path d="M226 330 Q256 365 286 330" stroke="#881337" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M232 334 Q256 360 280 334" fill="#ffffff"/>

  <!-- Headphone Earcups -->
  <rect x="100" y="235" width="46" height="85" rx="23" fill="#ffffff"/>
  <rect x="110" y="245" width="26" height="65" rx="13" fill="#06b6d4"/>

  <rect x="366" y="235" width="46" height="85" rx="23" fill="#ffffff"/>
  <rect x="376" y="245" width="26" height="65" rx="13" fill="#06b6d4"/>
</svg>
